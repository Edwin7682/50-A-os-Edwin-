<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f3c24">
<title>50 años | Edwin Fernando Alfonso Hernández</title>
<style>
:root{--verde:#1f3c24;--verde2:#355d3f;--crema:#f7f3ea;--dorado:#b88b30;--dorado2:#dcb45d;--blanco:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{font-family:Georgia,"Times New Roman",serif;background:var(--verde);overflow:hidden}
[hidden]{display:none!important}
#inicio{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;color:#fff;background:radial-gradient(circle at 50% 25%,rgba(220,180,93,.18),transparent 38%),linear-gradient(155deg,var(--verde),var(--verde2))}
.tarjeta{width:min(620px,100%);padding:48px 26px;text-align:center;border:1px solid rgba(220,180,93,.65);border-radius:28px;background:rgba(18,48,27,.72);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.etiqueta{margin-bottom:16px;font-size:.85rem;font-weight:bold;letter-spacing:.24em}
#nombreInvitado{margin-bottom:18px;color:var(--dorado2);font-size:clamp(2rem,7vw,3.5rem);line-height:1.12}
#pasesInvitado{max-width:520px;margin:0 auto 28px;font-size:clamp(1rem,4vw,1.3rem);line-height:1.55}
#invitacion,#visor{position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;background:var(--crema)}
.slide{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;visibility:hidden;opacity:0;transform:translateX(100%);pointer-events:none;background:var(--crema);transition:transform .65s cubic-bezier(.22,1,.36,1),opacity .35s ease,visibility 0s linear .65s}
.slide.activa{z-index:2;visibility:visible;opacity:1;transform:translateX(0);pointer-events:auto;transition-delay:0s}
.slide.salida{z-index:1;visibility:visible;opacity:0;transform:translateX(-100%)}
.contenido{min-height:0;overflow:auto;background:var(--crema);overscroll-behavior:contain}
.imagen{display:block;width:100%;height:100%;object-fit:contain;object-position:center top;background:var(--crema)}
.boton{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 20px;color:#fff;background:var(--dorado);border:1px solid var(--dorado);border-radius:999px;box-shadow:0 8px 22px rgba(105,75,15,.18);cursor:pointer;font:700 .86rem Georgia,serif;letter-spacing:.04em;text-decoration:none}
.secundario{color:var(--verde);background:transparent;border-color:rgba(31,60,36,.5);box-shadow:none}
nav{z-index:4;display:flex;justify-content:space-between;gap:10px;padding:12px 14px max(14px,env(safe-area-inset-bottom));background:rgba(247,243,234,.98);border-top:1px solid rgba(184,139,48,.25)}
.acciones{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:18px 14px}
.contador{color:#fff;background:linear-gradient(155deg,var(--verde),var(--verde2))}
.cuenta{display:grid;align-content:center;justify-items:center;min-height:0;padding:70px 20px 28px;text-align:center}
.cuenta h2{margin:18px 0 30px;color:var(--dorado2);font-size:clamp(2rem,7vw,3.5rem)}
.tiempo{display:grid;grid-template-columns:repeat(4,minmax(100px,1fr));gap:14px;width:min(760px,100%)}
.unidad{padding:22px 10px;border:1px solid rgba(220,180,93,.55);border-radius:18px;background:rgba(255,255,255,.08)}
.unidad strong,.unidad span{display:block}.unidad strong{color:var(--dorado2);font-size:clamp(2rem,6vw,3.4rem)}.unidad span{margin-top:7px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.fecha{margin-top:28px;font-size:1.05rem}.contador .secundario{color:#fff;border-color:rgba(255,255,255,.6)}
.superior{position:fixed;z-index:20;top:max(12px,env(safe-area-inset-top));right:12px;left:12px;display:flex;justify-content:space-between;pointer-events:none}
.superior>*{pointer-events:auto;min-width:44px;min-height:44px;color:#fff;background:rgba(31,60,36,.86);border:1px solid rgba(255,255,255,.58);border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#musicaBtn{cursor:pointer;font-size:1.2rem}.progreso{display:grid;place-items:center;padding:0 14px;font-size:.85rem;font-weight:bold}
@media(max-width:680px){.imagen{height:auto;min-height:100%;object-fit:contain}.tiempo{grid-template-columns:repeat(2,minmax(110px,1fr))}.boton{padding:11px 14px;font-size:.74rem}}
</style>
</head>
<body>
<section id="inicio"><div class="tarjeta"><p class="etiqueta">INVITADO ESPECIAL</p><h1 id="nombreInvitado">Invitado especial</h1><p id="pasesInvitado"></p><button id="abrir" class="boton" type="button">ABRIR INVITACIÓN</button></div></section>
<main id="invitacion" hidden><div id="visor"></div><div class="superior"><button id="musicaBtn" type="button" aria-label="Música">♫</button><div id="progreso" class="progreso">1 / 7</div></div><audio id="musica" loop preload="metadata"></audio></main>
<script>
"use strict";
const parametros=new URLSearchParams(location.search);
const nombre=(parametros.get("nombre")||"Invitado especial").trim();
const pases=Math.max(1,parseInt(parametros.get("pases"),10)||1);
const datos=[
 {tipo:"imagen",archivo:"PORTADA.png",alt:"Portada"},
 {tipo:"imagen",archivo:"BIENVENIDA.png",alt:"Bienvenida"},
 {tipo:"contador"},
 {tipo:"imagen",archivo:"UBICACION.png",alt:"Ubicación",acciones:[{texto:"VER UBICACIÓN",url:"https://maps.app.goo.gl/HE2tgvHuHPJm6so68"},{texto:"AGREGAR AL CALENDARIO",url:"https://www.google.com/calendar/render?action=TEMPLATE&text=Celebracion%2050%20anos%20Edwin&dates=20261011T170000Z%2F20261011T220000Z&location=Hacienda%20San%20Felipe"}]},
 {tipo:"imagen",archivo:"ALMUERZO.png",alt:"Almuerzo"},
 {tipo:"imagen",archivo:"CONFIRMACION.png",alt:"Confirmación",acciones:[{texto:"CONFIRMAR ASISTENCIA",url:"https://forms.gle/Qco4yvgkDKeDfZdv5"}]},
 {tipo:"imagen",archivo:"FINAL.png",alt:"Mensaje final"}
];
const inicio=document.getElementById("inicio"),invitacion=document.getElementById("invitacion"),visor=document.getElementById("visor"),progreso=document.getElementById("progreso"),musica=document.getElementById("musica"),musicaBtn=document.getElementById("musicaBtn");
document.getElementById("nombreInvitado").textContent=nombre;
document.getElementById("pasesInvitado").textContent=pases===1?"Hemos reservado 1 lugar para compartir esta celebración.":`Hemos reservado ${pases} lugares para compartir esta celebración.`;
function boton(texto,clase=""){const b=document.createElement("button");b.type="button";b.className=`boton ${clase}`.trim();b.textContent=texto;return b}
function nav(i){const n=document.createElement("nav");if(i>0){const a=boton("‹ ANTERIOR","secundario");a.onclick=()=>mostrar(actual-1);n.appendChild(a)}else n.appendChild(document.createElement("span"));if(i<datos.length-1){const s=boton("SIGUIENTE ›");s.onclick=()=>mostrar(actual+1);n.appendChild(s)}else n.appendChild(document.createElement("span"));return n}
function acciones(lista){const d=document.createElement("div");d.className="acciones";lista.forEach((x,i)=>{const b=boton(x.texto,i?"secundario":"");b.onclick=()=>window.open(x.url,"_blank","noopener,noreferrer");d.appendChild(b)});return d}
function slideImagen(x,i){const s=document.createElement("section");s.className=`slide${i===0?" activa":""}`;const c=document.createElement("div");c.className="contenido";const img=new Image();img.src=x.archivo;img.alt=x.alt;img.className="imagen";c.appendChild(img);if(x.acciones)c.appendChild(acciones(x.acciones));s.append(c,nav(i));return s}
function unidad(id,txt){const d=document.createElement("div");d.className="unidad";const b=document.createElement("strong");b.id=id;b.textContent="0";const s=document.createElement("span");s.textContent=txt;d.append(b,s);return d}
function slideContador(i){const s=document.createElement("section");s.className="slide contador";const c=document.createElement("div");c.className="cuenta";const e=document.createElement("p");e.className="etiqueta";e.textContent="FALTAN";const h=document.createElement("h2");h.textContent="Cuenta regresiva";const t=document.createElement("div");t.className="tiempo";t.append(unidad("dias","Días"),unidad("horas","Horas"),unidad("minutos","Minutos"),unidad("segundos","Segundos"));const f=document.createElement("p");f.className="fecha";f.textContent="11 de octubre de 2026 · 12:00 m.";c.append(e,h,t,f);s.append(c,nav(i));return s}
datos.forEach((x,i)=>visor.appendChild(x.tipo==="contador"?slideContador(i):slideImagen(x,i)));
const slides=[...document.querySelectorAll(".slide")];let actual=0,bloqueo=false;
function mostrar(n){if(bloqueo||n<0||n>=slides.length||n===actual)return;bloqueo=true;const vieja=slides[actual],nueva=slides[n];if(n<actual)nueva.style.transform="translateX(-100%)";nueva.classList.add("activa");requestAnimationFrame(()=>requestAnimationFrame(()=>{nueva.style.transform="";if(n>actual)vieja.classList.add("salida");vieja.classList.remove("activa")}));setTimeout(()=>{vieja.classList.remove("salida");actual=n;progreso.textContent=`${actual+1} / ${slides.length}`;bloqueo=false},680)}
document.getElementById("abrir").onclick=()=>{inicio.hidden=true;invitacion.hidden=false;musica.src="vivir-mi-vida.mp3";musica.play().catch(()=>{})};
musicaBtn.onclick=()=>musica.paused?musica.play().catch(()=>{}):musica.pause();
let x=null;document.addEventListener("touchstart",e=>x=e.changedTouches[0].clientX,{passive:true});document.addEventListener("touchend",e=>{if(x===null||invitacion.hidden)return;const d=e.changedTouches[0].clientX-x;x=null;if(Math.abs(d)>70)mostrar(actual+(d<0?1:-1))},{passive:true});
const fecha=new Date("2026-10-11T12:00:00-05:00").getTime();function reloj(){const d=Math.max(0,fecha-Date.now()),v=[Math.floor(d/86400000),Math.floor(d%86400000/3600000),Math.floor(d%3600000/60000),Math.floor(d%60000/1000)];["dias","horas","minutos","segundos"].forEach((id,i)=>document.getElementById(id).textContent=i?String(v[i]).padStart(2,"0"):v[i])}reloj();setInterval(reloj,1000);
</script>
</body>
</html>
